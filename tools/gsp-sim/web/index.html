<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP-GSP 场景预览</title>
<style>
  :root {
    color-scheme: dark;
    --btn-default: #ff4c01;
    --shell-scale: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #16171A;
    font-family: system-ui, sans-serif;
  }
  .stage {
    display: grid;
    justify-items: center;
    gap: 16px;
    padding: 32px 24px 40px;
  }
  .device-wrap {
    width: 534px;
    height: 561px;
    transform: scale(var(--shell-scale));
    transform-origin: top center;
    margin-bottom: calc(561px * (var(--shell-scale) - 1));
  }
  .device { position: relative; width: 534px; height: 561px; }
  .body-shell {
    position: absolute; left: 0; top: 19px; width: 534px; height: 534px;
    border-radius: 21px;
    background: linear-gradient(160deg, #D2D2D2 0%, #BBBBBB 45%, #A6A6A6 100%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .5);
  }
  .bezel {
    position: absolute; left: 7px; top: 28px; width: 520px; height: 514px;
    border-radius: 60px; background: #000;
  }
  .screen {
    position: absolute; left: 27.42px; top: 45px; width: 480px; height: 480px;
    border-radius: 60px; overflow: hidden; background: #000; isolation: isolate;
  }
  .screen canvas {
    position: absolute; inset: 0; width: 480px; height: 480px;
    border: 0; border-radius: inherit; display: block;
    touch-action: none; image-rendering: pixelated; background: #000;
  }
  .glare {
    position: absolute; inset: 0; border-radius: 60px; pointer-events: none;
    background: linear-gradient(145deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,0) 42%);
  }
  .key {
    position: absolute; z-index: 2; padding: 0; border: 0;
    background: var(--btn-default); cursor: pointer;
    transition: filter .1s, transform .1s;
  }
  .key:active, .key.pressed { filter: brightness(.8); }
  .key-top {
    left: 377.42px; top: 0; width: 92px; height: 19px;
    border-radius: 5px 5px 0 0;
  }
  .key-top.pressed { transform: translateY(2px); }
  .key-bl {
    left: 41.42px; top: 553px; width: 103px; height: 8px;
    border-radius: 0 0 4px 4px; pointer-events: none;
  }
  .key-br {
    left: 377.42px; top: 553px; width: 103px; height: 8px;
    border-radius: 0 0 4px 4px;
  }
  .key-bl.pressed,
  .key-br.pressed { transform: translateY(-2px); }
  p { margin: 0; color: #8A8C90; font-size: 13px; }
  @media (max-width: 580px) {
    :root { --shell-scale: 0.72; }
  }
</style>
<link rel="stylesheet" href="sideboards.css?v=4">
</head>
<body>
  <div class="stage">
    <div class="device-wrap">
      <div class="device">
        <div class="side-module side-module-left" data-side-module="left" aria-hidden="true">
          <img class="side-module-art" data-sideboard-art alt="">
          <div class="camera-fixtures">
            <i class="camera-lens"></i>
            <i class="camera-flash camera-flash-top"></i>
            <i class="camera-flash camera-flash-bottom"></i>
          </div>
          <div class="ws2812-grid" data-ws2812-grid></div>
        </div>
        <div class="main-board">
          <div class="body-shell"></div>
          <div class="bezel"></div>
          <div class="screen">
            <canvas id="canvas" width="480" height="480" oncontextmenu="event.preventDefault()"></canvas>
            <div class="glare"></div>
          </div>
          <button class="key key-top" id="gpio7-key" type="button"
                  aria-label="GPIO7" title="GPIO7，低电平有效"></button>
          <div class="key key-bl" aria-hidden="true"></div>
          <button class="key key-br" id="sim-power-key" type="button"
                  aria-label="电源" title="电源"></button>
        </div>
        <div class="side-module side-module-right" data-side-module="right" aria-hidden="true">
          <img class="side-module-art" data-sideboard-art alt="">
          <div class="camera-fixtures">
            <i class="camera-lens"></i>
            <i class="camera-flash camera-flash-top"></i>
            <i class="camera-flash camera-flash-bottom"></i>
          </div>
          <div class="ws2812-grid" data-ws2812-grid></div>
        </div>
      </div>
    </div>
    <div class="sideboard-panel" aria-label="子板">
      <div class="sideboard-panel-title">已有子板</div>
      <div class="sideboard-list">
        <button class="sideboard-card" type="button" data-sideboard-set="camera" data-sideboard-side="left" aria-pressed="false">
          <img src="assets/camera-board-clean.png" alt="">
          <span>摄像头</span>
          <small>左侧</small>
        </button>
        <button class="sideboard-card" type="button" data-sideboard-set="ws2812" data-sideboard-side="left" aria-pressed="false">
          <img src="assets/ws2812-board-unlit.png" alt="">
          <span>灯板</span>
          <small>左侧</small>
        </button>
        <button class="sideboard-card" type="button" data-sideboard-set="ws2812" data-sideboard-side="right" aria-pressed="false">
          <img src="assets/ws2812-board-unlit.png" alt="">
          <span>灯板</span>
          <small>右侧</small>
        </button>
      </div>
    </div>
    <p id="status">仿真已关闭</p>
  </div>
<script>
  (function () {
    var key = document.getElementById("gpio7-key");
    key.addEventListener("pointerdown", function (event) {
      key.setPointerCapture(event.pointerId);
      key.classList.add("pressed");
    });
    var release = function () { key.classList.remove("pressed"); };
    key.addEventListener("pointerup", release);
    key.addEventListener("pointercancel", release);
  })();
</script>
<script src="sideboards.js?v=4"></script>
<template id="scene-script-template">
  <script src="gsp_sim.js"></script>
  <script src="player.js"></script>
</template>
<script>
  (function () {
    var powerKey = document.getElementById("sim-power-key");
    var status = document.getElementById("status");
    var template = document.getElementById("scene-script-template");
    var started = false;
    var release = function () { powerKey.classList.remove("pressed"); };

    var startSimulation = function () {
      if (!started) {
        started = true;
        status.textContent = "正在开机…";
      } else {
        status.textContent = "正在关机…";
        window.location.reload();
        return;
      }
      template.content.querySelectorAll("script").forEach(function (sourceScript) {
        var script = document.createElement("script");
        Array.prototype.forEach.call(sourceScript.attributes, function (attribute) {
          script.setAttribute(attribute.name, attribute.value);
        });
        script.async = false;
        script.addEventListener("error", function () {
          status.textContent = "启动失败：无法加载仿真脚本";
        });
        document.body.appendChild(script);
      });
    };

    powerKey.addEventListener("pointerdown", function (event) {
      powerKey.setPointerCapture(event.pointerId);
      powerKey.classList.add("pressed");
      startSimulation();
    });
    powerKey.addEventListener("pointerup", release);
    powerKey.addEventListener("pointercancel", release);
  })();
</script>
</body>
</html>
