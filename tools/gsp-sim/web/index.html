<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP-GSP web preview</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, sans-serif;
    background: #14181f; color: #dde;
    display: flex; flex-direction: column; align-items: center;
  }
  main { display: grid; justify-items: center; gap: 14px; padding: 24px; }
  canvas {
    width: min(92vw, 480px); height: auto;
    border: 1px solid #345; border-radius: 18px;
    image-rendering: pixelated; touch-action: none;
    background: #000; box-shadow: 0 18px 55px #0009;
  }
  p { margin: 0; color: #8a9; font-size: 14px; }
</style>
</head>
<body>
<main>
  <b>ESP-GSP preview</b>
  <canvas id="canvas" width="480" height="480" oncontextmenu="event.preventDefault()"></canvas>
  <p id="status">Loading WebAssembly player…</p>
</main>
<script src="gsp_sim.js"></script>
<script src="player.js"></script>
</body>
</html>
